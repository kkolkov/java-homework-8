name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Java version
        run: java -version
      - name: Build and test
        run: ./gradlew clean build
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          if-no-files-found: error
