spring.application.name=java-homework-8
server.port=${PORT:8088}
server.servlet.context-path=/api
spring.datasource.url=jdbc:h2:mem:messages;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.default_batch_fetch_size=0
logging.level.org.hibernate.stat=OFF
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=OFF
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:OFF}
server.error.include-message=always
