plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

def springBootVersion = '3.5.5'
def jpaDependency = "org.springframework.boot:spring-boot-starter-data-jpa:${springBootVersion}"

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    implementation jpaDependency
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-registry-prometheus-simpleclient'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
    afterSuite { descriptor, result ->
        if (!descriptor.parent) {
            println "Tests: ${result.resultType}, total: ${result.testCount}, failed: ${result.failedTestCount}"
        }
    }
}

tasks.register('runTestDataInitializer', Exec) {
    commandLine 'bash', 'scripts/seed.sh'
}
