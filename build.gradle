plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

def springBootVersion = '3.5.5'
def jpaDependency = "org.springframework.boot:spring-boot-starter-data-jpa:${springBootVersion}"

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
    implementation jpaDependency
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

test {
    useJUnitPlatform()
}

tasks.register('runTestDataInitializer', Exec) {
    commandLine 'bash', 'scripts/seed.sh'
}
